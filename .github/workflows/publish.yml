name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PACKAGE_VERSION="$(node --print "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            if [[ "$PACKAGE_VERSION" != *-* ]]; then
              echo "A GitHub prerelease requires a prerelease package version." >&2
              exit 1
            fi
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            if [[ "$PACKAGE_VERSION" == *-* ]]; then
              echo "A prerelease package version must use a GitHub prerelease." >&2
              exit 1
            fi
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Publish package
        run: npm publish --tag "${{ steps.release.outputs.dist-tag }}"
